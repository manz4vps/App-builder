plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.contoh.smartsidebar'
    compileSdk 34

    defaultConfig {
        applicationId "com.contoh.smartsidebar"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Samain versi Java 17 biar kodingan gak bentrok
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Versi Shizuku diturunin ke 12.1.0 biar fitur newProcess kebuka
    implementation 'dev.rikka.shizuku:api:12.1.0'
}
