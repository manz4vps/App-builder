plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.contoh.smartsidebar'
    compileSdk 34

    defaultConfig {
        applicationId "com.contoh.smartsidebar"
        minSdk 26 // Minimal Android 8
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Library Shizuku wajib masuk sini
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
