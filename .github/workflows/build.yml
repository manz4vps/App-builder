name: Build Android APK

on:
  push:
    branches:
      - main # Jalan otomatis tiap ada push ke branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Beri izin eksekusi Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK ke Github Actions
        uses: actions/upload-artifact@v3
        with:
          name: Smart-Sidebar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
