name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ini JALUR VIP-nya, langsung install Gradle 8.4 yang pas buat Android
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Sekarang panggil gradle biasa, otomatis pakai versi 8.4 tadi
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK ke Github Actions
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sidebar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
