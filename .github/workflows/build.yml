name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step "chmod" dihapus karena tidak perlu
      
      - name: Build APK (Pakai Gradle Bawaan GitHub)
        run: gradle assembleDebug

      - name: Upload APK ke Github Actions
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sidebar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
